media: img

content:
  - name: portada
    label: Portada
    type: file
    path: datos/inicio.json
    format: json
    fields:
      - name: titulo
        label: Título
        type: string
      - name: subtitulo
        label: Subtítulo
        type: string
      - name: imagen
        label: Imagen del banner
        type: image
      - name: alt
        label: Texto alternativo de la imagen
        type: string

  - name: talleres
    label: Talleres
    type: collection
    path: contenido/talleres
    fields:
      - name: body
        label: Introducción (opcional)
        type: rich-text
      - name: secciones
        label: Contenido (agrega los bloques que necesites, en orden)
        type: object
        list: true
        fields:
          - name: subtitulo
            label: Subtítulo (opcional)
            type: string
          - name: imagen
            label: Imagen (opcional)
            type: image
          - name: alt
            label: Texto alternativo de la imagen
            type: string
          - name: video
            label: Enlace de YouTube (opcional)
            type: string
          - name: descripcion
            label: Descripción (opcional)
            type: rich-text
