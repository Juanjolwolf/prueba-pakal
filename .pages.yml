media: img

content:
  - name: portada
    label: Portada
    type: file
    path: datos/inicio.json
    format: json
    fields:
      - name: titulo
        label: Título
        type: string
      - name: subtitulo
        label: Subtítulo
        type: string
      - name: imagen
        label: Imagen del banner
        type: image
      - name: alt
        label: Texto alternativo de la imagen
        type: string

  - name: talleres
    label: Talleres
    type: file
    path: datos/talleres.json
    format: json
    fields:
      - name: talleres
        label: Talleres
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: fecha
            label: Fecha
            type: date
          - name: descripcion
            label: Descripción
            type: text
          - name: imagen
            label: Imagen
            type: image
          - name: alt
            label: Texto alternativo de la imagen
            type: string
